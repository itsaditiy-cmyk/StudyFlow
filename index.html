<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#111827">

<title>StudyFlow</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    background: #f5f6fa;

    color: #171717;

}

button,
input,
select,
textarea {

    font: inherit;

}

button {

    cursor: pointer;

}


/* =========================
   APP
========================= */

.app {

    max-width: 700px;

    margin: auto;

    padding-bottom: 100px;

}


/* =========================
   HEADER
========================= */

header {

    background: white;

    padding: 18px 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
    1px solid #e5e7eb;

    position: sticky;

    top: 0;

    z-index: 10;

}

.logo {

    font-size: 25px;

    font-weight: 800;

}

.subtitle {

    color: #737373;

    font-size: 12px;

}

.account-button {

    background: #111827;

    color: white;

    border: none;

    padding: 9px 14px;

    border-radius: 20px;

}


/* =========================
   MAIN
========================= */

main {

    padding: 20px;

}

h1 {

    font-size: 30px;

    margin: 5px 0;

}

h2 {

    font-size: 20px;

}

h3 {

    margin-bottom: 5px;

}

.muted {

    color: #737373;

}


/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns:
    1fr 1fr;

    gap: 12px;

    margin: 20px 0;

}

.stat {

    background: white;

    padding: 18px;

    border-radius: 18px;

    border:
    1px solid #e5e7eb;

}

.stat strong {

    display: block;

    font-size: 25px;

}


/* =========================
   CARDS
========================= */

.card {

    background: white;

    border-radius: 18px;

    padding: 18px;

    margin-bottom: 12px;

    border:
    1px solid #e5e7eb;

}


/* =========================
   QUOTE
========================= */

.quote {

    background: #111827;

    color: white;

    padding: 22px;

    border-radius: 20px;

    margin: 20px 0;

}

.quote-text {

    font-size: 18px;

    font-weight: 700;

}

.quote-author {

    font-size: 12px;

    opacity: .7;

    margin-top: 10px;

}


/* =========================
   TASKS
========================= */

.task-header {

    display: flex;

    gap: 14px;

    align-items: center;

}

.icon {

    width: 45px;

    height: 45px;

    border-radius: 14px;

    background: #f0f1f5;

    display: grid;

    place-items: center;

    font-size: 22px;

}

.task-title {

    font-weight: 700;

}

.task-subject {

    color: #737373;

    font-size: 12px;

}

.task-time {

    color: #737373;

    font-size: 13px;

}

.actions {

    display: flex;

    gap: 7px;

    margin-top: 15px;

    flex-wrap: wrap;

}

.actions button {

    border: none;

    padding: 10px 13px;

    border-radius: 11px;

    background: #f1f1f3;

}

.primary {

    background:
    #111827 !important;

    color: white !important;

}


/* =========================
   EXAMS
========================= */

.exam {

    background: white;

    padding: 18px;

    border-radius: 18px;

    margin-bottom: 12px;

    border:
    1px solid #e5e7eb;

}

.exam-top {

    display: flex;

    justify-content:
    space-between;

}

.countdown {

    font-weight: 800;

}

.topic {

    display: inline-block;

    background: #f1f1f3;

    padding: 6px 9px;

    border-radius: 9px;

    font-size: 12px;

    margin: 3px;

}


/* =========================
   NAVIGATION
========================= */

nav {

    position: fixed;

    bottom: 0;

    left: 50%;

    transform:
    translateX(-50%);

    width:
    min(700px, 100%);

    background: white;

    border-top:
    1px solid #ddd;

    display: grid;

    grid-template-columns:
    repeat(5, 1fr);

    padding: 7px;

    z-index: 20;

}

nav button {

    background: none;

    border: none;

    padding: 6px;

    font-size: 18px;

}

nav span {

    display: block;

    font-size: 9px;

    color: #737373;

}


/* =========================
   FEED
========================= */

.feed {

    height: 72vh;

    overflow-y: scroll;

    scroll-snap-type: y mandatory;

}

.video {

    height: 72vh;

    scroll-snap-align: start;

    background: #111827;

    color: white;

    border-radius: 20px;

    margin-bottom: 15px;

    position: relative;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    padding: 20px;

}

.video-placeholder {

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    bottom: 0;

    display: grid;

    place-items: center;

    font-size: 55px;

}

.video-info {

    position: relative;

    z-index: 2;

}

.video-actions {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}

.video-actions button {

    border: none;

    background:
    rgba(255,255,255,.15);

    color: white;

    padding: 10px;

    border-radius: 12px;

}


/* =========================
   CATEGORY BUTTONS
========================= */

.categories {

    display: flex;

    gap: 8px;

    overflow-x: auto;

    margin-bottom: 15px;

}

.category {

    border: none;

    padding: 9px 13px;

    border-radius: 20px;

    background: white;

    white-space: nowrap;

}


/* =========================
   CREATOR
========================= */

.creator {

    text-align: center;

}

.creator-icon {

    width: 75px;

    height: 75px;

    background: #111827;

    color: white;

    border-radius: 50%;

    display: grid;

    place-items: center;

    margin: auto;

    font-size: 30px;

}


/* =========================
   FORMS
========================= */

label {

    display: block;

    font-size: 13px;

    font-weight: 700;

    margin-top: 15px;

    margin-bottom: 6px;

}

input,
select,
textarea {

    width: 100%;

    padding: 12px;

    border:
    1px solid #d4d4d8;

    border-radius: 11px;

    background: white;

}

textarea {

    min-height: 100px;

    resize: vertical;

}

.form-button {

    width: 100%;

    border: none;

    padding: 13px;

    border-radius: 12px;

    margin-top: 20px;

}


/* =========================
   MODAL
========================= */

.modal-bg {

    position: fixed;

    inset: 0;

    background:
    rgba(0,0,0,.45);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    z-index: 50;

}

.modal {

    background: white;

    width:
    min(700px,100%);

    padding: 25px;

    border-radius:
    25px 25px 0 0;

    max-height: 90vh;

    overflow-y: auto;

}

.modal-header {

    display: flex;

    justify-content:
    space-between;

}

.close {

    border: none;

    background: #f1f1f3;

    border-radius: 50%;

    width: 35px;

    height: 35px;

    font-size: 20px;

}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    background: white;

    padding: 35px 20px;

    border-radius: 18px;

    border:
    1px dashed #ccc;

}

.empty-icon {

    font-size: 40px;

}


/* =========================
   PRO
========================= */

.price {

    font-size: 32px;

    font-weight: 800;

    margin: 20px 0 5px;

}

.pro-list {

    text-align: left;

    line-height: 2;

    list-style: none;

    padding: 0;

}

</style>

</head>


<body>


<div class="app">


<header>

    <div>

        <div class="logo">
            StudyFlow
        </div>

        <div class="subtitle">
            Your syllabus. Your schedule. One plan.
        </div>

    </div>


    <button
        class="account-button"
        onclick="account()"
    >
        👤 Account
    </button>

</header>


<main id="app"></main>


<nav>

    <button onclick="home()">
        🏠
        <span>Home</span>
    </button>

    <button onclick="planner()">
        📅
        <span>Planner</span>
    </button>

    <button onclick="feed()">
        ▶️
        <span>StudyFeed</span>
    </button>

    <button onclick="exams()">
        📝
        <span>Exams</span>
    </button>

    <button onclick="progress()">
        📊
        <span>Progress</span>
    </button>

</nav>


</div>


<script>


/* =========================
   DATA
========================= */

let data =
JSON.parse(
    localStorage.getItem(
        "studyflow"
    )
) || {

    name: "",

    subjects: [

        "Mathematics",

        "Science",

        "Social Studies",

        "English",

        "Hindi",

        "Marathi",

        "Bengali",

        "Tamil",

        "Telugu",

        "Kannada",

        "Malayalam",

        "Gujarati",

        "Punjabi",

        "French",

        "German",

        "Spanish",

        "Computer Science",

        "Art",

        "Music",

        "Physical Education"

    ],

    exams: [],

    tasks: [],

    savedVideos: []

};


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(

        "studyflow",

        JSON.stringify(data)

    );

}


/* =========================
   QUOTES
========================= */

const quotes = [

    "Small progress is still progress.",

    "You don't have to be perfect. Just keep going.",

    "Your future self will thank you.",

    "One chapter at a time.",

    "Consistency beats motivation.",

    "Believe you can, and you're halfway there.",

    "You are capable of more than you think.",

    "Study today. Celebrate tomorrow."

];


function dailyQuote() {

    let day =
        Math.floor(
            Date.now() /
            86400000
        );

    return quotes[
        day % quotes.length
    ];

}


/* =========================
   TODAY
========================= */

function today() {

    return new Date()
        .toISOString()
        .split("T")[0];

}


/* =========================
   DAYS UNTIL
========================= */

function daysUntil(date) {

    let now =
        new Date();

    let exam =
        new Date(date);

    return Math.max(

        0,

        Math.ceil(

            (
                exam -

                new Date(

                    now.getFullYear(),

                    now.getMonth(),

                    now.getDate()

                )

            ) / 86400000

        )

    );

}


/* =========================
   HOME
========================= */

function home() {

    let tasks =
        data.tasks.filter(

            task =>

                task.date ===
                today()

                &&

                !task.done

        );


    let completed =
        data.tasks.filter(
            task => task.done
        ).length;


    let percent =
        data.tasks.length

        ?

        Math.round(

            completed /

            data.tasks.length *

            100

        )

        :

        0;


    document.getElementById(
        "app"
    ).innerHTML = `


        <p class="muted">
            GOOD EVENING
        </p>


        <h1>
            ${data.name || "Ready to study?"} 👋
        </h1>


        <div class="quote">

            <div class="quote-text">

                ✨ "${dailyQuote()}"

            </div>

            <div class="quote-author">

                StudyFlow Motivation

            </div>

        </div>


        <div class="stats">


            <div class="stat">

                <strong>
                    ${tasks.length}
                </strong>

                <span class="muted">
                    Tasks today
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${percent}%
                </strong>

                <span class="muted">
                    Completed
                </span>

            </div>


        </div>


        <div class="card">

            <h3>
                🔥 Keep your streak going
            </h3>

            <p class="muted">
                Complete today's tasks to stay on track.
            </p>

        </div>


        <h2>
            Today's plan
        </h2>


        ${

            tasks.length

            ?

            tasks
                .map(taskCard)
                .join("")

            :

            `

            <div class="empty">

                <div class="empty-icon">
                    🎉
                </div>

                <h3>
                    Nothing due today
                </h3>

                <p class="muted">
                    Add an exam to generate your plan.
                </p>

                <button
                    class="primary form-button"
                    onclick="addExam()"
                >
                    Create exam
                </button>

            </div>

            `

        }


        <h2>
            Upcoming exams
        </h2>


        ${

            data.exams

            .slice(0,3)

            .map(examCard)

            .join("")

        }

    `;

}


/* =========================
   TASK CARD
========================= */

function taskCard(task) {

    return `

        <div class="card">

            <div class="task-header">

                <div class="icon">
                    📚
                </div>

                <div>

                    <div class="task-subject">
                        ${task.subject}
                    </div>

                    <div class="task-title">
                        ${task.topic}
                    </div>

                    <div class="task-time">
                        ${task.duration} minutes
                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="primary"
                    onclick="
                    startTimer(${task.id})
                    "
                >
                    ⏱ Start
                </button>


                <button
                    onclick="
                    completeTask(${task.id})
                    "
                >
                    ✓ Done
                </button>


                <button
                    onclick="
                    moveTomorrow(${task.id})
                    "
                >
                    Tomorrow
                </button>

            </div>

        </div>

    `;

}


/* =========================
   COMPLETE TASK
========================= */

function completeTask(id) {

    let task =
        data.tasks.find(
            task => task.id === id
        );


    if (task) {

        task.done = true;

        save();

        home();

    }

}


/* =========================
   MOVE TOMORROW
========================= */

function moveTomorrow(id) {

    let task =
        data.tasks.find(
            task => task.id === id
        );


    if (!task)
        return;


    let date =
        new Date();


    date.setDate(
        date.getDate() + 1
    );


    task.date =
        date.toISOString()
        .split("T")[0];


    save();

    home();

}


/* =========================
   ADD EXAM
========================= */

function addExam() {

    let modal =
        document.createElement(
            "div"
        );


    modal.className =
        "modal-bg";


    modal.innerHTML = `

        <div class="modal">

            <div class="modal-header">

                <h2>
                    Add an exam
                </h2>

                <button
                    class="close"
                    onclick="
                    this.closest('.modal-bg').remove()
                    "
                >
                    ×
                </button>

            </div>


            <label>
                Exam name
            </label>


            <input
                id="examName"
                placeholder="Science PT1"
            >


            <label>
                Subject
            </label>


            <select id="examSubject">

                ${

                    data.subjects

                    .map(

                        subject =>

                        `<option>
                            ${subject}
                        </option>`

                    )

                    .join("")

                }


                <option>
                    Other
                </option>

            </select>


            <label>
                Custom subject
            </label>


            <input
                id="customSubject"
                placeholder="Only use this if you chose Other"
            >


            <label>
                Exam date
            </label>


            <input
                type="date"
                id="examDate"
            >


            <label>
                Topics
            </label>


            <input
                id="examTopics"
                placeholder="Motion, Cell, Matter"
            >


            <button
                class="primary form-button"
                onclick="
                createExam(this)
                "
            >
                Create study plan
            </button>

        </div>

    `;


    document.body.appendChild(
        modal
    );

}


/* =========================
   CREATE EXAM
========================= */

function createExam(button) {

    let name =
        document.getElementById(
            "examName"
        ).value;


    let subject =
        document.getElementById(
            "examSubject"
        ).value;


    let custom =
        document.getElementById(
            "customSubject"
        ).value.trim();


    if (
        subject === "Other"
        &&
        custom
    ) {

        subject =
            custom;

    }


    let date =
        document.getElementById(
            "examDate"
        ).value;


    let topics =
        document.getElementById(
            "examTopics"
        )
        .value
        .split(",")
        .map(
            topic =>
            topic.trim()
        )
        .filter(Boolean);


    if (
        !name
        ||
        !date
        ||
        !topics.length
    ) {

        alert(
            "Please fill in everything."
        );

        return;

    }


    let exam = {

        id:
            Date.now(),

        name:
            name,

        subject:
            subject,

        date:
            date,

        topics:
            topics

    };


    data.exams.push(
        exam
    );


    generateTasks(
        exam
    );


    button
        .closest(".modal-bg")
        .remove();


    home();

}


/* =========================
   GENERATE TASKS
========================= */

function generateTasks(exam) {

    exam.topics.forEach(

        (topic,index) => {

            let date =
                new Date();


            date.setDate(

                date.getDate()
                +
                Math.min(
                    index,
                    daysUntil(
                        exam.date
                    )
                )

            );


            data.tasks.push({

                id:
                    Date.now()
                    +
                    Math.random(),

                subject:
                    exam.subject,

                topic:
                    topic,

                date:
                    date.toISOString()
                    .split("T")[0],

                duration:
                    30,

                done:
                    false

            });

        }

    );


    save();

}


/* =========================
   EXAMS
========================= */

function exams() {

    document.getElementById(
        "app"
    ).innerHTML = `


        <p class="muted">
            DEADLINES
        </p>


        <h1>
            Your exams
        </h1>


        <button
            class="primary form-button"
            onclick="addExam()"
        >
            + Add exam
        </button>


        <br><br>


        ${

            data.exams.length

            ?

            data.exams

            .map(examCard)

            .join("")

            :

            `

            <div class="empty">

                <div class="empty-icon">
                    📝
                </div>

                <h3>
                    No exams yet
                </h3>

                <p class="muted">
                    Add your first exam.
                </p>

            </div>

            `

        }

    `;

}


/* =========================
   EXAM CARD
========================= */

function examCard(exam) {

    return `

        <div class="exam">

            <div class="exam-top">

                <div>

                    <div class="muted">
                        ${exam.subject}
                    </div>

                    <h3>
                        ${exam.name}
                    </h3>

                    <div class="muted">
                        ${exam.date}
                    </div>

                </div>


                <div class="countdown">

                    ${daysUntil(
                        exam.date
                    )}d

                </div>

            </div>


            <div>

                ${

                    exam.topics

                    .map(

                        topic =>

                        `<span class="topic">
                            ${topic}
                        </span>`

                    )

                    .join("")

                }

            </div>

        </div>

    `;

}


/* =========================
   PLANNER
========================= */

function planner() {

    let dates = [];


    for (
        let i = 0;
        i < 7;
        i++
    ) {

        let date =
            new Date();


        date.setDate(
            date.getDate() + i
        );


        dates.push(

            date
            .toISOString()
            .split("T")[0]

        );

    }


    document.getElementById(
        "app"
    ).innerHTML = `


        <p class="muted">
            YOUR WEEK
        </p>


        <h1>
            Planner
        </h1>


        ${

            dates

            .map(

                date => {

                    let tasks =
                        data.tasks.filter(

                            task =>
                            task.date ===
                            date

                        );


                    return `

                        <h2>

                            ${

                                new Date(
                                    date
                                )

                                .toLocaleDateString(

                                    "en-IN",

                                    {

                                        weekday:
                                        "long",

                                        day:
                                        "numeric",

                                        month:
                                        "short"

                                    }

                                )

                            }

                        </h2>


                        ${

                            tasks.length

                            ?

                            tasks

                            .map(taskCard)

                            .join("")

                            :

                            `

                            <p class="muted">
                                Nothing planned.
                            </p>

                            `

                        }

                    `;

                }

            )

            .join("")

        }

    `;

}


/* =========================
   STUDY FEED
========================= */

function feed() {

    document.getElementById(
        "app"
    ).innerHTML = `


        <p class="muted">
            LEARN WITHOUT GETTING BORED
        </p>


        <h1>
            StudyFeed 📱
        </h1>


        <div class="categories">

            <button
                class="category"
            >
                All
            </button>

            <button
                class="category"
            >
                🧮 Maths
            </button>

            <button
                class="category"
            >
                🔬 Science
            </button>

            <button
                class="category"
            >
                📖 Languages
            </button>

            <button
                class="category"
            >
                💻 Coding
            </button>

            <button
                class="category"
            >
                🌍 Social Studies
            </button>

        </div>


        <div class="feed">


            ${videoCard(

                "🧮",

                "Algebra in 60 seconds",

                "Maths",

                "@StudyMath"

            )}


            ${videoCard(

                "🔬",

                "Why does the sky look blue?",

                "Science",

                "@ScienceShorts"

            )}


            ${videoCard(

                "📖",

                "Learn 5 French words",

                "French",

                "@LanguageLab"

            )}


            ${videoCard(

                "🌍",

                "The Indian Constitution explained",

                "Social Studies",

                "@HistoryHub"

            )}


            ${videoCard(

                "💻",

                "What is an algorithm?",

                "Computer Science",

                "@CodeKids"

            )}

        </div>

    `;

}


/* =========================
   VIDEO CARD
========================= */

function videoCard(
    emoji,
    title,
    subject,
    creator
) {

    return `

        <div class="video">

            <div class="video-placeholder">

                ${emoji}

            </div>


            <div class="video-info">

                <p class="muted"
                   style="color:white">

                    ${subject}

                </p>


                <h2>
                    ${title}
                </h2>


                <p>
                    ${creator}
                </p>


                <div class="video-actions">

                    <button
                        onclick="
                        alert('Saved!')
                        "
                    >
                        ❤️ Like
                    </button>

/* =========================
   PROGRESS
========================= */

function progress() {

    let completed =
        data.tasks.filter(
            task => task.done
        ).length;


    let total =
        data.tasks.length;


    let percent =
        total

        ?

        Math.round(
            completed /
            total *
            100
        )

        :

        0;


    document.getElementById(
        "app"
    ).innerHTML = `


        <p class="muted">
            YOUR PROGRESS
        </p>


        <h1>
            Progress
        </h1>


        <div
            class="card"
            style="text-align:center"
        >

            <div
                style="
                font-size:55px;
                font-weight:800"
            >

                ${percent}%

            </div>


            <p class="muted">
                Tasks completed
            </p>


            <div
                style="
                height:10px;
                background:#eee;
                border-radius:10px;
                overflow:hidden"
            >

                <div
                    style="
                    width:${percent}%;
                    height:100%;
                    background:#111827"
                >
                </div>

            </div>


            <p>

                ${completed}

                of

                ${total}

                tasks completed

            </p>

        </div>


        <div class="stats">


            <div class="stat">

                <strong>
                    ${data.subjects.length}
                </strong>

                <span class="muted">
                    Subjects
                </span>

            </div>


            <div class="stat">

                <strong>
                    ${data.exams.length}
                </strong>

                <span class="muted">
                    Exams
                </span>

            </div>


        </div>

    `;

}
